name = "goeye-samknows"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Create with:  npx wrangler@4 kv namespace create ARCHIVES
# then paste the printed id below (it is an identifier, not a secret).
[[kv_namespaces]]
binding = "ARCHIVES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (not stored here):
#   npx wrangler secret put SAMKNOWS_USER
#   npx wrangler secret put SAMKNOWS_PASS
