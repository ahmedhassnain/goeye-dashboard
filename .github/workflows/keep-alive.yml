name: Keep API awake

# Backup pinger for the Render API, which sleeps after 15 minutes without
# traffic. cron-job.org is the main pinger (see docs/deploy-render.md);
# GitHub often runs schedules late, so this only fills gaps. Set the
# BACKEND_URL repository variable (Settings > Secrets and variables > Actions >
# Variables) to the service URL, e.g. https://<service>.onrender.com.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /docs
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::BACKEND_URL repository variable is not set; skipping ping."
            exit 0
          fi
          url="${BACKEND_URL%/}/docs"
          echo "Pinging $url"
          # A sleeping service can take a moment to wake, so retry.
          curl --fail --silent --show-error --output /dev/null \
               --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
               --write-out "HTTP %{http_code} in %{time_total}s\n" "$url"
