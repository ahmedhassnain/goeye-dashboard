name: Keep API awake

# Hugging Face Spaces (free CPU Basic) sleeps after ~48h without traffic.
# Pinging every 12h keeps it awake. Set the BACKEND_URL repository variable
# (Settings > Secrets and variables > Actions > Variables), for example
# https://<user>-<space>.hf.space. The same job keeps a Render fallback warm-ish.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /docs
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::BACKEND_URL repository variable is not set; skipping ping."
            exit 0
          fi
          url="${BACKEND_URL%/}/docs"
          echo "Pinging $url"
          # A sleeping Space can take a while to wake, so retry generously.
          curl --fail --silent --show-error --output /dev/null \
               --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
               --write-out "HTTP %{http_code} in %{time_total}s\n" "$url"
